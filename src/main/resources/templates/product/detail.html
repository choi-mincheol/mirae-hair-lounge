<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(title=${detail.product.name}, activeMenu='products', content=~{::content})}">
<body>
<section th:fragment="content" th:with="product=${detail.product}">
    <h1 class="h3" th:text="${product.name}" data-testid="product-name">상품명</h1>

    <dl class="row" data-testid="product-info">
        <dt class="col-sm-3">분류</dt>
        <dd class="col-sm-9" th:text="${product.categoryName}" data-testid="product-category">분류</dd>
        <dt class="col-sm-3">브랜드</dt>
        <dd class="col-sm-9" th:text="${product.brand} ?: '-'" data-testid="product-brand">브랜드</dd>
        <dt class="col-sm-3">기본 판매가</dt>
        <dd class="col-sm-9 num" th:text="${#numbers.formatInteger(product.basePrice, 1, 'COMMA')} + '원'"
            data-testid="product-base-price">0원</dd>
        <dt class="col-sm-3">판매 여부</dt>
        <dd class="col-sm-9" data-testid="product-status">
            <span th:if="${product.active}">판매 중</span>
            <span th:unless="${product.active}" class="badge text-bg-secondary">판매 중지</span>
        </dd>
    </dl>

    <h2 class="h5">옵션</h2>
    <p th:if="${#lists.isEmpty(detail.options)}" data-testid="product-options-empty">등록된 옵션이 없습니다.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(detail.options)}">
        <table class="table table-hover table-stack" data-testid="product-options-table">
            <thead>
            <tr>
                <th scope="col">옵션</th>
                <th scope="col">바코드</th>
                <th scope="col" class="num">판매가</th>
                <th scope="col" class="num">재고</th>
                <th scope="col" class="num">최소 재고</th>
                <th scope="col">상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="option : ${detail.options}" th:classappend="${!option.active} ? 'row-muted'"
                th:attr="data-testid='product-option-row-' + ${option.id}">
                <td data-label="옵션" th:text="${option.name}">옵션</td>
                <td data-label="바코드" th:text="${option.barcode} ?: '-'">바코드</td>
                <td data-label="판매가" class="num"
                    th:text="${#numbers.formatInteger(option.price, 1, 'COMMA')} + '원'">0원</td>
                <td data-label="재고" class="num" th:text="${option.currentStock}">0</td>
                <td data-label="최소 재고" class="num" th:text="${option.minStock}">0</td>
                <td data-label="상태">
                    <span th:unless="${option.active}" class="badge text-bg-secondary">판매 중지</span>
                    <span th:if="${option.lowStock}" class="badge text-bg-warning">재고 부족</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
